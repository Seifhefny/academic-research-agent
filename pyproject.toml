[project]
name = "academic-research-agent"
version = "0.1.0"
description = "Check a research claim against arXiv papers with a local LLM, with quotes verified against the source text"
requires-python = ">=3.11"

[project.scripts]
check-claim = "research_agent.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = '-m "not live"'
markers = ["live: needs Ollama running locally and internet access (slow)"]
filterwarnings = ["ignore::DeprecationWarning"]
